# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# set the default terminal type
set -g default-terminal "screen-256color"
set -as terminal-features ",*:RGB"

# source configu with C-b + r
bind-key r source-file ~/.tmux-conf \; display-message "~/.tmux.conf reloaded"

# enable mouse mode
set -g mouse on
set -g history-limit 50000
# start counting windows and panles from 0
set -g base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
set -g focus-events on
set -g set-clipboard on

# do not rename windows automatically
set-option -g allow-rename off

# split panes vertically with |
# split panes horizontally with -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# vim-style pane selection
bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

# swith panes using Alt-arrow w/o prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# turn off all the bell sounds
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# ────────────────────────────────────────────
# THEME · Catppuccin Mocha
# ────────────────────────────────────────────

# Status bar
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#181825,fg=#CDD6F4"
set -g status-justify absolute-centre

# Left · Session
set -g status-left-length 30
set -g status-left '#[fg=#1E1E2E,bg=#CBA6F7,bold] 󰆍 #S #[default]'

# Center · Windows
set -g window-status-separator ""
set -g window-status-format '#[fg=#6C7086,bg=#181825]  #I:#W  '
set -g window-status-current-format '#[fg=#1E1E2E,bg=#CBA6F7,bold]  #I:#W  #[default]'

# Window indicators
setw -g window-status-activity-style "fg=#F9E2AF"
setw -g window-status-bell-style "fg=#F38BA8,bold"

# Right · Host and time
set -g status-right-length 55
set -g status-right '#[fg=#89B4FA] 󰒋 #H #[fg=#6C7086]│ #[fg=#A6E3A1]󰥔 %H:%M #[fg=#6C7086]│ #[fg=#CDD6F4]%b %d '

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#CBA6F7"

# Messages and command prompt
set -g message-style "bg=#CBA6F7,fg=#1E1E2E,bold"
set -g message-command-style "bg=#313244,fg=#CDD6F4"

# Copy-mode highlight
set -g mode-style "bg=#CBA6F7,fg=#1E1E2E"

# automatically save/restore sessions
set -g @continuum-restore 'on'
set -g @resurrect-pane-contents 'on'

run '~/.tmux/plugins/tpm/tpm'
